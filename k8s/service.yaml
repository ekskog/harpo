apiVersion: v1
kind: Service
metadata:
  name: harp-api
  namespace: harp
  labels:
    app: harp-api
spec:
  type: LoadBalancer
  selector:
    app: harp-api
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: harpo-ui
  namespace: harp
  labels:
    app: harpo-ui
spec:
  type: ClusterIP
  selector:
    app: harpo-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000


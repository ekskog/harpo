apiVersion: v1
kind: Secret
metadata:
  name: harpo-secret
  namespace: harp
type: Opaque
stringData:
  # Database connection envs used by the backend. Replace the example values below.
  # Since the DB service lives in the `data` namespace, use the full in-cluster DNS name
  # so pods in namespace `harp` can resolve it: mariadb-service.data.svc.cluster.local
  DB_HOST: "mariadb-service.data.svc.cluster.local"
  DB_PORT: "3306"
  DB_USER: "eliot"
  DB_PASS: "eliotPWD4maria"
  DB_NAME: "harp_db"
  # Optional flags
  DB_ALLOW_DEFAULTS: "true"
  DB_DEBUG: "false"

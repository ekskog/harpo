apiVersion: v1
kind: Namespace
metadata:
  name: harp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harp-ui
  namespace: harp
  labels:
    app: harp-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harp-ui
  template:
    metadata:
      labels:
        app: harp-ui
    spec:
      containers:
        - name: harp-ui
          image: ghcr.io/<your-username>/harp-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: harp-ui
  namespace: harp
  labels:
    app: harp-ui
  annotations:
    metallb.universe.tf/address-pool: cluster-pool
spec:
  type: LoadBalancer
  selector:
    app: harp-ui
  ports:
    - name: http
      port: 80
      targetPort: 80

---

apiVersion: apps/v1
kind: Deployment
metadata:
	name: harpo-backend
	namespace: harp
	labels:
		app: harpo-backend
spec:
	replicas: 2
	selector:
		matchLabels:
			app: harpo-backend
	template:
		metadata:
			labels:
				app: harpo-backend
		spec:
			containers:
				- name: backend
					image: ekskog/harpo-backend:latest
					imagePullPolicy: IfNotPresent
					ports:
						- containerPort: 3000
					envFrom:
						- configMapRef:
								name: harpo-config
						- secretRef:
								name: harpo-secret
					resources:
						requests:
							cpu: "100m"
							memory: "128Mi"
						limits:
							cpu: "500m"
							memory: "512Mi"
					livenessProbe:
						httpGet:
							path: /health
							port: 3000
						initialDelaySeconds: 30
						periodSeconds: 10
						failureThreshold: 3
					readinessProbe:
						httpGet:
							path: /health
							port: 3000
						initialDelaySeconds: 5
						periodSeconds: 5
						failureThreshold: 3


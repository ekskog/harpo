apiVersion: apps/v1
kind: Deployment
metadata:
  name: harp-api
  namespace: harp
  labels:
    app: harp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harp-api
  template:
    metadata:
      labels:
        app: harp-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: harp-api
          image: ghcr.io/ekskog/harp-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: harpo-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

---

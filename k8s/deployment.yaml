name: Build and publish harp-fe image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and push harp-fe image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI
        uses: docker/build-push-action@v4
        with:
          context: ./harp-ui
          file: ./harp-ui/Dockerfile
          # ONLY amd64 - no more QEMU/Illegal Instruction errors
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harp-fe:latest
            ghcr.io/${{ github.repository_owner }}/harp-fe:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Update Deployment Image
        run: |
          # Point the deployment to the NEW image name
          kubectl -n harp set image deployment/harp-ui harp-ui=ghcr.io/${{ github.repository_owner }}/harp-fe:latest
          kubectl -n harp rollout restart deployment/harp-ui
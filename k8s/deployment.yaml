apiVersion: apps/v1
kind: Deployment
metadata:
  name: harp-api
  namespace: harp
  labels:
    app: harp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harp-api
  template:
    metadata:
      labels:
        app: harp-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: harp-api
          image: ghcr.io/ekskog/harp-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: harpo-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: harp
              mountPath: /app/harp
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: harp
          persistentVolumeClaim:
            claimName: harp-nfspvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harp-ui
  namespace: harp
  labels:
    app: harp-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harp-ui
  template:
    metadata:
      labels:
        app: harp-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: harp-ui
          image: ghcr.io/ekskog/harp-fe:latest
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: "http://harp-api.harp.svc.cluster.local:80"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

name: Build and publish harp-api image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-api/**'
      - '.github/workflows/api-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harp-api/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy API to k8s after build?'
        required: true
        default: 'false'
        type: choice
        options: [ 'true', 'false' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push harp-api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # Updated to v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Updated to v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3 # Updated to v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generate tags and labels
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/harp-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and push API (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./harp-api
          file: ./harp-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
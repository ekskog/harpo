Cname: Build and publish harpo-ui image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
      - '.github/workflows/harp-ui.yml'
  workflow_dispatch:

concurrency:
  group: build-and-push-harpo-ui
  cancel-in-progress: true

jobs:
  build:
    name: Build and push harpo-ui image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./harp-ui
          file: ./harp-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/ekskog/harpo-ui:latest
            ghcr.io/ekskog/harpo-ui:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ekskog/harpo-ui:latest
          cache-to: type=inline

      - name: Deploy to k8s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          kubectl set image deployment/harpo-ui backend=ghcr.io/ekskog/harpo-ui:${{ github.sha }} -n webapps
          kubectl rollout status deployment/harpo-ui -n webapps --timeout=120s

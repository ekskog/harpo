name: Build and publish harp-api image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-api/**'
      - '.github/workflows/harp-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harp-api/**'
  workflow_dispatch:

concurrency:
  group: build-and-push-harp-api
  cancel-in-progress: true

jobs:
  build:
    name: Build and push harp-api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./harp-api
          file: ./harp-api/Dockerfile
          push: true
          tags: |
            ghcr.io/ekskog/harp-api:latest
            ghcr.io/ekskog/harp-api:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ekskog/harp-api:latest
          cache-to: type=inline

      - name: Deploy to k8s
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          kubectl set image deployment/harp-api harp-api=ghcr.io/ekskog/harp-api:${{ github.sha }} -n webapps
          kubectl rollout status deployment/harp-api -n webapps --timeout=120s

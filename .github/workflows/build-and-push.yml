name: Build and publish harp images

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
      - 'harp-api/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
      - 'harp-api/**'
  workflow_dispatch: {}

concurrency:
  group: build-and-push-harp
  cancel-in-progress: true

jobs:
  build-ui:
    name: Build and push harp-ui image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: harp-ui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('harp-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm registry
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('harp-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install and verify Node dependencies
        working-directory: ./harp-ui
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build and push UI (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: ./harp-ui
          file: ./harp-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ekskog/harp-ui:latest
            ghcr.io/ekskog/harp-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api:
    name: Build and push harp-api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: harp-api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('harp-api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm registry
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('harp-api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install and verify Node dependencies
        working-directory: ./harp-api
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build and push API (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: ./harp-api
          file: ./harp-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ekskog/harpo-backend:latest
            ghcr.io/ekskog/harpo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

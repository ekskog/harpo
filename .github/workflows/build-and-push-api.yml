name: Build and publish harp-api image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-api/**'
      - '.github/workflows/build-and-push-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harp-api/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy API to k8s after build?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

concurrency:
  group: build-and-push-harp-api
  cancel-in-progress: true

jobs:
  build:
    name: Build and push harp-api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: harp-api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('harp-api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm registry
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('harp-api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install and verify Node dependencies
        working-directory: ./harp-api
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build and push API (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: ./harp-api
          file: ./harp-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ekskog/harp-api:latest
            ghcr.io/ekskog/harp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k8s
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to k8s
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/harp-api -n harp --timeout=300s

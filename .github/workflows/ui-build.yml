name: Build and publish harp-ui image

on:
  push:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
      - '.github/workflows/ui-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harp-ui/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy UI to k8s after build?'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

concurrency:
  group: build-and-push-harp-ui
  cancel-in-progress: true

jobs:
  build:
    name: Build and push harp-ui image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: harp-ui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('harp-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm registry
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('harp-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install and verify Node dependencies
        working-directory: ./harp-ui
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build UI assets
        working-directory: ./harp-ui
        run: |
          npm run build

      - name: Build and push UI (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: ./harp-ui
          file: ./harp-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ekskog/harp-ui:latest
            ghcr.io/ekskog/harp-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes (optional)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Set image and rollout
        run: |
          kubectl -n harp set image deployment/harp-ui harp-ui=ghcr.io/ekskog/harp-ui:latest
          kubectl -n harp rollout status deployment/harp-ui --timeout=120s
